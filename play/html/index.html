<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <ar-button-3>点击0次</ar-button-3>

    <script type="module">
      import ArtoUI from "https://unpkg.com/arto-ui";

      new ArtoUI();
    </script>

    <script>
      const button = document.querySelector("ar-button-3");

      let count = 0;

      button.onclick = () => {
        count++;
        button.textContent = `点击${count}次`;
      };
    </script>
  </body>
</html>
